<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>สินค้า — Ruby Pet Shop</title>
  <meta name="description" content="Ruby Pet Shop ร้านอาหารและของเล่นหมาแมวคุณภาพดี ส่งเร็ว ราคาถูก"/>
  <!-- Open Graph injected dynamically by product.js -->
  <meta property="og:type"        content="product" id="ogType"/>
  <meta property="og:site_name"   content="Ruby Pet Shop"/>
  <meta property="og:url"         content="" id="ogUrl"/>
  <meta property="og:title"       content="สินค้า — Ruby Pet Shop" id="ogTitle"/>
  <meta property="og:description" content="Ruby Pet Shop ร้านอาหารและของเล่นหมาแมวคุณภาพดี" id="ogDesc"/>
  <meta property="og:image"       content="" id="ogImage"/>
  <meta name="twitter:card"        content="summary_large_image"/>
  <meta name="twitter:title"       content="สินค้า — Ruby Pet Shop" id="twTitle"/>
  <meta name="twitter:description" content="Ruby Pet Shop ร้านอาหารและของเล่นหมาแมวคุณภาพดี" id="twDesc"/>
  <meta name="twitter:image"       content="" id="twImage"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="style.css"/>
  <link rel="stylesheet" href="product.css"/>
</head>
<body>

  <!-- ===== NAVBAR (reuse from index) ===== -->
  <header class="navbar" id="navbar">
    <div class="container navbar__inner">
      <a href="index.html" class="logo">
        <span class="logo__icon">🐾</span>
        <span class="logo__text">Ruby<span class="logo__accent"> Pet</span></span>
      </a>
      <nav class="nav__links">
        <a href="shop.html">🛍️ ร้านค้า</a>
        <a href="index.html#categories">หมวดหมู่</a>
        <a href="index.html#bestsellers">สินค้าขายดี</a>
        <a href="index.html#blog">Pet Care Tips</a>
        <a href="index.html#contact">ติดต่อเรา</a>
      </nav>
      <div class="navbar__actions">
        <button class="btn-icon cart-btn" id="cartBtn" aria-label="ตะกร้า">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
          <span class="cart-badge" id="cartCount">0</span>
        </button>
        <a href="index.html" class="btn btn-outline" style="padding:10px 20px;font-size:14px">← กลับหน้าร้าน</a>
      </div>
    </div>
  </header>

  <!-- ===== BREADCRUMB ===== -->
  <div class="breadcrumb-bar">
    <div class="container">
      <nav class="breadcrumb" id="breadcrumb">
        <a href="index.html">หน้าแรก</a>
        <span>›</span>
        <a href="index.html#categories" id="bcCategory">สินค้า</a>
        <span>›</span>
        <span id="bcProduct">กำลังโหลด...</span>
      </nav>
    </div>
  </div>

  <!-- ===== PRODUCT MAIN ===== -->
  <main class="product-main">
    <div class="container">
      <div class="product-layout" id="productLayout">

        <!-- SKELETON while loading -->
        <div class="skeleton-gallery">
          <div class="skeleton skeleton--main"></div>
          <div class="skeleton-thumbs">
            <div class="skeleton skeleton--thumb"></div>
            <div class="skeleton skeleton--thumb"></div>
            <div class="skeleton skeleton--thumb"></div>
          </div>
        </div>
        <div class="skeleton-info">
          <div class="skeleton skeleton--title"></div>
          <div class="skeleton skeleton--line"></div>
          <div class="skeleton skeleton--line short"></div>
          <div class="skeleton skeleton--price"></div>
          <div class="skeleton skeleton--btn"></div>
        </div>

      </div>
    </div>
  </main>

  <!-- ===== TABS SECTION ===== -->
  <section class="product-tabs-section" id="tabsSection" style="display:none">
    <div class="container">
      <div class="product-tabs">
        <button class="product-tab active" data-tab="description">รายละเอียด</button>
        <button class="product-tab" data-tab="ingredients">ส่วนผสม & โภชนาการ</button>
        <button class="product-tab" data-tab="howto">วิธีใช้</button>
        <button class="product-tab" data-tab="reviews">รีวิว <span class="tab-badge" id="reviewCount">0</span></button>
      </div>

      <div class="tab-content active" id="tab-description"></div>
      <div class="tab-content" id="tab-ingredients"></div>
      <div class="tab-content" id="tab-howto"></div>
      <div class="tab-content" id="tab-reviews"></div>
    </div>
  </section>

  <!-- ===== RECENTLY VIEWED ===== -->
  <section class="recently-viewed" id="recentlyViewedSection" style="display:none">
    <div class="container">
      <div class="section__header" style="margin-bottom:24px">
        <h2 class="section__title" style="font-size:22px">🕐 เพิ่งดูล่าสุด</h2>
      </div>
      <div class="rv-strip" id="recentlyViewedStrip"></div>
    </div>
  </section>

  <!-- ===== RELATED PRODUCTS ===== -->
  <section class="section" id="relatedSection" style="display:none">
    <div class="container">
      <div class="section__header">
        <h2 class="section__title">สินค้าที่คุณอาจชอบ</h2>
        <p class="section__sub">คัดสรรมาให้พิเศษสำหรับน้อง 🐾</p>
      </div>
      <div class="products__grid" id="relatedGrid"></div>
    </div>
  </section>

  <!-- ===== TOAST ===== -->
  <div class="toast" id="toast"></div>

  <!-- ===== STICKY ADD TO CART (Mobile) ===== -->
  <div class="sticky-atc" id="stickyAtc">
    <div class="sticky-atc__info">
      <strong id="stickyName"></strong>
      <span class="price" id="stickyPrice"></span>
    </div>
    <button class="btn btn-primary" id="stickyAddCart">🛒 หยิบใส่ตะกร้า</button>
  </div>

  <!-- LINE FLOAT -->
  <a href="#" class="line-float" aria-label="Line OA">
    <span>💬</span>
    <span class="line-float__label">Line OA</span>
  </a>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="product.js"></script>
  <script src="chat-widget.js"></script>
  <script src="compare-widget.js"></script>
</body>
</html>
